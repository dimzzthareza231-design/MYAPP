name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Tombol "Run workflow" di tab Actions untuk deploy ulang main secara manual.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build aplikasi inti
        run: npm run build:core

      - name: Build web publik
        run: npm run build:public

  deploy:
    name: Deploy ke Cloudflare
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Deploy tidak boleh dibatalkan di tengah jalan oleh push berikutnya.
    concurrency:
      group: deploy-cloudflare
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Tanpa secret, deploy dilewati (bukan gagal) agar CI tetap hijau sampai Cloudflare disiapkan.
      - name: Cek secret
        id: secret
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Deploy dilewati: secret repo CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID belum terbaca (Settings > Secrets and variables > Actions)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.secret.outputs.ok == 'true'
        run: npm ci

      - name: Migrasi D1
        if: steps.secret.outputs.ok == 'true'
        run: npm run cf:migrate

      - name: Deploy kedua Worker
        if: steps.secret.outputs.ok == 'true'
        run: npm run cf:deploy

      - name: Cek health aplikasi inti
        if: steps.secret.outputs.ok == 'true'
        run: curl -fsS --retry 5 --retry-delay 5 https://myitaru-core.myappv1.workers.dev/api/v1/health
