name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint:eslint

      - name: Test
        run: npm test

      - name: Build aplikasi inti
        run: npm run build:core

      - name: Build web publik
        run: npm run build:public

      - name: Bundle Cloudflare Worker (dry run)
        run: npx wrangler deploy --dry-run --env core --outdir .wrangler/dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
