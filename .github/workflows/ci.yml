name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Tombol "Run workflow" di tab Actions untuk deploy ulang main secara manual.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Dry-run deploy web publik (mode Cloudflare)
        run: npx wrangler deploy --env public --dry-run

      - name: Dry-run deploy aplikasi inti (mode Cloudflare)
        run: npx wrangler deploy --env core --dry-run

  deploy:
    name: Deploy ke Cloudflare
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: myitaru
    timeout-minutes: 20
    # Deploy tidak boleh dibatalkan di tengah jalan oleh push berikutnya.
    concurrency:
      group: deploy-cloudflare
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Tanpa secret, deploy dilewati (bukan gagal) agar CI tetap hijau sampai Cloudflare disiapkan.
      - name: Cek secret
        id: secret
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Deploy dilewati: environment myitaru membutuhkan secret CLOUDFLARE_API_TOKEN dan variable CLOUDFLARE_ACCOUNT_ID."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Normalisasi account ID Cloudflare
        if: steps.secret.outputs.ok == 'true'
        run: |
          account_id="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          if [ -z "$account_id" ]; then
            echo "::error::Variable CLOUDFLARE_ACCOUNT_ID kosong setelah whitespace dibuang."
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: Install
        if: steps.secret.outputs.ok == 'true'
        run: npm ci

      - name: Catat versi aktif sebelum deploy
        id: versions
        if: steps.secret.outputs.ok == 'true'
        run: |
          echo "public=$(npx wrangler versions list --env public --json | jq -r '.[-1].id // empty')" >> "$GITHUB_OUTPUT"
          echo "core=$(npx wrangler versions list --env core --json | jq -r '.[-1].id // empty')" >> "$GITHUB_OUTPUT"

      - name: Build Worker mode Cloudflare
        if: steps.secret.outputs.ok == 'true'
        run: npm run cf:build

      - name: Deploy web publik
        id: deploy_public
        if: steps.secret.outputs.ok == 'true'
        run: npx wrangler deploy --env public

      - name: Deploy aplikasi inti
        id: deploy_core
        if: steps.secret.outputs.ok == 'true'
        run: npx wrangler deploy --env core

      - name: Cek health aplikasi inti
        if: steps.secret.outputs.ok == 'true'
        run: curl -fsS --retry 5 --retry-delay 5 https://myitaru-core.myappv1.workers.dev/api/v1/health

      - name: Rollback aplikasi inti jika deploy atau health check gagal
        if: failure() && steps.secret.outputs.ok == 'true' && steps.versions.outputs.core != ''
        run: npx wrangler rollback "${{ steps.versions.outputs.core }}" --env core --yes

      - name: Rollback web publik jika deploy atau health check gagal
        if: failure() && steps.secret.outputs.ok == 'true' && steps.versions.outputs.public != ''
        run: npx wrangler rollback "${{ steps.versions.outputs.public }}" --env public --yes
