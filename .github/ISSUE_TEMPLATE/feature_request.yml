name: Usulan fitur
description: Usulkan fitur atau perbaikan
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Masalah yang ingin diselesaikan
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Usulan solusi
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Web publik pasien, Aplikasi inti SIMK/RME, AI, Integrasi (BPJS/SATUSEHAT/dll.), Infrastruktur/Cloudflare]
